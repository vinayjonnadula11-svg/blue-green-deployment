
apiVersion: apps/v1
kind: Deployment
metadata:
  name: green-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: blue-green-site
      version: green
  template:
    metadata:
      labels:
        app: blue-green-site
        version: green
    spec:
      containers:
        - name: green-container
          image: green-green-site:2.0
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
