
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blue-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: blue-green-site
      version: blue
  template:
    metadata:
      labels:
        app: blue-green-site
        version: blue
    spec:
      containers:
        - name: blue-container
          image: blue-green-site:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
